    <path d="M48 448H752" stroke="#d7dfe4"/>
    <text x="48" y="477" fill="#88939b" font-size="11">LECTURE NOTES · INTRODUCTION TO DATABASE SYSTEMS</text>
    <text x="733" y="477" fill="#88939b" font-size="11">06</text>
  </g>
